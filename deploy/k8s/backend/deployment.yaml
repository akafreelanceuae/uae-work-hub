apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: uae-work-hub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: ghcr.io/IMAGE_OWNER/uae-work-hub-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: MONGODB_URI
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: REDIS_URL
            - name: FRONTEND_URL
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: FRONTEND_URL
            - name: ALLOWED_ORIGINS
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: ALLOWED_ORIGINS
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: JWT_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: JWT_REFRESH_SECRET
            - name: JWT_EMAIL_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: JWT_EMAIL_SECRET
            - name: JWT_RESET_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: JWT_RESET_SECRET
            - name: ENABLE_PROMETHEUS_METRICS
              value: "true"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
