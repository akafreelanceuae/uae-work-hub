apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.AppVersion }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          env:
            - name: NODE_ENV
              value: "{{ .Values.env.nodeEnv }}"
            - name: PORT
              value: "{{ .Values.env.port }}"
            - name: ENABLE_PROMETHEUS_METRICS
              value: "{{ ternary "true" "false" .Values.env.enableMetrics }}"
            - name: ENABLE_TRACING
              value: "{{ ternary "true" "false" .Values.env.enableTracing }}"
            - name: REQUIRE_REDIS_READY
              value: "{{ ternary "true" "false" .Values.env.requireRedisReady }}"
            - name: REQUIRE_ORIGIN_IN_PROD
              value: "{{ ternary "true" "false" .Values.env.requireOriginInProd }}"
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.name }}
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /live
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
