version: '3.8'

services:
  # MongoDB - Primary database with encryption at rest
  mongodb:
    image: mongo:7.0
    container_name: uae-workhub-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: uae_secure_pass_2024
      MONGO_INITDB_DATABASE: uae_workhub
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - uae-network
    command: mongod --auth --bind_ip_all

  # Redis - Caching and session storage
  redis:
    image: redis:7.2-alpine
    container_name: uae-workhub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - uae-network
    command: redis-server --appendonly yes --requirepass uae_redis_2024

  # API Service - Node.js/Express backend
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: uae-workhub-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://admin:uae_secure_pass_2024@mongodb:27017/uae_workhub?authSource=admin
      REDIS_URL: redis://:uae_redis_2024@redis:6379
      JWT_SECRET: uae_jwt_secret_2024_very_secure_key
      UAE_PASS_CLIENT_ID: ${UAE_PASS_CLIENT_ID:-test_client_id}
      UAE_PASS_CLIENT_SECRET: ${UAE_PASS_CLIENT_SECRET:-test_client_secret}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-uae_encryption_key_32_chars_long}
      ALLOWED_ORIGINS: http://localhost:3000,http://web:3000
    volumes:
      - ./apps/api/src:/app/src
      - ./apps/api/uploads:/app/uploads
    depends_on:
      - mongodb
      - redis
    networks:
      - uae-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # AI Service - Python FastAPI for NLP
  ai:
    build:
      context: ./apps/ai
      dockerfile: Dockerfile
    container_name: uae-workhub-ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      REDIS_URL: redis://:uae_redis_2024@redis:6379
      MODEL_CACHE_DIR: /app/models
      LOG_LEVEL: INFO
    volumes:
      - ./apps/ai/src:/app/src
      - ai_models:/app/models
    depends_on:
      - redis
    networks:
      - uae-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Web App - Next.js frontend
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: uae-workhub-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:5000
      NEXT_PUBLIC_AI_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:5000
      NEXTAUTH_SECRET: uae_nextauth_secret_2024
      NEXTAUTH_URL: http://localhost:3000
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/public:/app/public
    depends_on:
      - api
      - ai
    networks:
      - uae-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  ai_models:
    driver: local

networks:
  uae-network:
    driver: bridge